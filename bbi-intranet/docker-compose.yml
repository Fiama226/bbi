services:
  spfx:
    build: .
    container_name: bbi-spfx
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - ./:/bbi
      - bbi_node_modules:/bbi/node_modules
      - bbi_dev_certs:/root/.rushstack
    environment:
      NODE_OPTIONS: "--max-old-space-size=3072"
      SPFX_SERVE_TENANT_DOMAIN: ${SPFX_TENANT_DOMAIN:-votretenant.sharepoint.com}
    command: sh -c "npm ci --no-audit --no-fund && npm run start"
    healthcheck:
      test: ["CMD", "node", "scripts/doctor.cjs", "--container", "--allow-untrusted"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
volumes:
  bbi_node_modules:
  bbi_dev_certs:
